name: Build llama.cpp ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential ninja-build ccache libcurl4-openssl-dev libssl-dev

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGGML_CCACHE=ON
          -DLLAMA_BUILD_TESTS=OFF
          -DLLAMA_BUILD_EXAMPLES=OFF
          -DLLAMA_CURL=OFF
          -DGGML_NATIVE=OFF
          -DCMAKE_C_FLAGS="-mcpu=cortex-a76.cortex-a55+crc+crypto+dotprod"
          -DCMAKE_CXX_FLAGS="-mcpu=cortex-a76.cortex-a55+crc+crypto+dotprod"

      - name: Build
        run: cmake --build build --config Release -j$(nproc)

      - name: Strip binaries
        run: strip --strip-unneeded build/bin/* || true

      - name: Organize into bin/lib
        run: |
          mkdir -p package/bin package/lib
          mv build/bin/*.so* package/lib/ 2>/dev/null || true
          find build/bin -maxdepth 1 -type f -exec mv {} package/bin/ \;

      - name: Compress with xz
        run: tar -cJf llama-arm64.tar.xz -C package bin lib

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-arm64-binaries
          path: llama-arm64.tar.xz
